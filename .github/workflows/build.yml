name: Build Windows Executable

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Patch CMakeLists for Windows & Zlib
      shell: pwsh
      run: |
        $path = "CMakeLists.txt"
        $text = Get-Content $path -Raw
        
        # 1. Update version requirement
        $text = [System.Text.RegularExpressions.Regex]::Replace($text, 'cmake_minimum_required\s*\([^\)]+\)', 'cmake_minimum_required(VERSION 3.10)')
        
        # 2. Disable or remove Zlib dependency requirement if present, or we can pass a flag
        # Let's write out the patched file
        Set-Content $path $text -NoNewline

    - name: Configure CMake (Without Zlib)
      run: cmake -S . -B build -DMINISAT_USE_ZLIB=OFF

    - name: Build Minisat
      run: cmake --build build --config Release

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: minisat-windows
        path: |
          build/Release/minisat.exe
          build/minisat.exe
        if-no-files-found: error
