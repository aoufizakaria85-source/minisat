
name: Build MiniSat

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev

      - name: Build MiniSat
        run: |
          make -j2 r cr

      - name: Verify executables
        run: |
          test -x build/release/bin/minisat
          test -x build/release/bin/minisat_core

          build/release/bin/minisat -h || true
          build/release/bin/minisat_core -h || true

      - name: Test SAT and UNSAT instances
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p test-cases

          cat > test-cases/sat.cnf <<'EOF'
          p cnf 2 2
          1 2 0
          -1 2 0
          EOF

          cat > test-cases/unsat.cnf <<'EOF'
          p cnf 1 2
          1 0
          -1 0
          EOF

          set +e
          build/release/bin/minisat \
            test-cases/sat.cnf test-cases/sat.out
          sat_rc=$?

          build/release/bin/minisat \
            test-cases/unsat.cnf test-cases/unsat.out
          unsat_rc=$?
          set -e

          grep -qx 'SATISFIABLE' test-cases/sat.out
          grep -qx 'UNSATISFIABLE' test-cases/unsat.out

          echo "SAT exit code: $sat_rc"
          echo "UNSAT exit code: $unsat_rc"

      - name: Prepare binary artifacts
        run: |
          mkdir -p artifacts
          cp build/release/bin/minisat artifacts/
          cp build/release/bin/minisat_core artifacts/

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: minisat-ubuntu-24.04-x86_64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
