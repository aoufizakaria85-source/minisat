name: Build Windows Executable

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Patch CMakeLists for modern CMake
      shell: pwsh
      run: |
        $path = "CMakeLists.txt"
        $text = Get-Content $path -Raw
        # Update old cmake_minimum_required to version 3.5
        $text = [System.Text.RegularExpressions.Regex]::Replace($text, 'cmake_minimum_required\s*\([^\)]+\)', 'cmake_minimum_required(VERSION 3.5)')
        Set-Content $path $text -NoNewline

    - name: Configure CMake
      run: cmake -S . -B build

    - name: Build Minisat
      run: cmake --build build --config Release

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: minisat-windows
        path: |
          build/Release/minisat.exe
          build/minisat.exe
        if-no-files-found: error
