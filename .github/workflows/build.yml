
name: Build MiniSat for Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Windows build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib

      - name: Update legacy CMake requirement
        run: |
          sed -i \
            's/cmake_minimum_required(VERSION 2\.6 FATAL_ERROR)/cmake_minimum_required(VERSION 3.10 FATAL_ERROR)/' \
            CMakeLists.txt

      - name: Configure Windows build
        run: |
          cmake -S . -B build-win -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DSTATIC_BINARIES=ON

      - name: Compile MiniSat
        run: |
          cmake --build build-win --parallel 2

      - name: Verify Windows executables
        run: |
          test -f build-win/minisat.exe
          test -f build-win/minisat_core.exe

          file build-win/minisat.exe
          file build-win/minisat_core.exe

            - name: Test SAT and UNSAT
        shell: msys2 {0}
        run: |
          set -eu

          mkdir -p test-cases

          cat > test-cases/sat.cnf <<'EOF'
          p cnf 2 2
          1 2 0
          -1 2 0
          EOF

          cat > test-cases/unsat.cnf <<'EOF'
          p cnf 1 2
          1 0
          -1 0
          EOF

          ./build-win/minisat.exe \
            test-cases/sat.cnf test-cases/sat.out || true

          ./build-win/minisat.exe \
            test-cases/unsat.cnf test-cases/unsat.out || true

          grep -qx 'SATISFIABLE' test-cases/sat.out
          grep -qx 'UNSATISFIABLE' test-cases/unsat.out

          echo "Both SAT and UNSAT tests passed."

      - name: Stage Windows binaries
        run: |
          mkdir -p artifacts
          cp build-win/minisat.exe artifacts/
          cp build-win/minisat_core.exe artifacts/

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: minisat-windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
